name: Azure Static Web Apps CI/CD

# Builds happen in explicit steps here rather than inside SWA's Oryx build, so
# we get normal npm semantics, dependency caching, and readable logs. SWA is
# handed two finished artifacts: web/dist and a pruned api/.

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Build web
        run: |
          npm ci --prefix web
          npm run build --prefix web

      - name: Build api
        run: |
          npm ci --prefix api
          npm run build --prefix api

      # Prune to the single runtime dependency (@azure/functions). Everything
      # else is inlined into dist/index.js by esbuild, so shipping devDeps would
      # only bloat the upload.
      - name: Prune api to runtime dependencies
        run: npm ci --omit=dev --prefix api

      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client

      - name: Get Id Token
        uses: actions/github-script@v7
        id: idtoken
        with:
          script: |
            const coredemo = require('@actions/core')
            return await coredemo.getIDToken()
          result-encoding: string

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GENTLE_SKY_0CF50A710 }}
          action: "upload"
          app_location: "web/dist"   # already-built static assets
          api_location: "api"        # managed Azure Functions (node:20)
          output_location: ""        # app_location is the output
          skip_app_build: true
          skip_api_build: true
          github_id_token: ${{ steps.idtoken.outputs.result }}

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "close"
