name: CI

# Runs on EVERY branch. This matters: the SWA deploy workflow only triggers on
# `main`, so without this there is no feedback loop at all while working on a
# feature branch.

on:
  push:
    branches-ignore: []
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install
        run: |
          npm ci
          npm ci --prefix web
          npm ci --prefix api

      # shared/ is pure functions encoding rules that are easy to get subtly
      # wrong and painful to debug in production — recurrence across DST, streak
      # state transitions, key round-trips, the PG-13 filter. This is where
      # nearly all the test value lives.
      - name: Unit tests (shared/)
        run: npm test

      # Integration tests run against Azurite rather than mocks. The design
      # leans on real storage semantics — deterministic row keys, 409 on
      # duplicate create, ETag conflicts — and a mocked table client would
      # agree with whatever we assumed and catch none of it.
      #
      # Started here rather than as a service container so it matches local
      # development exactly, and so the binding behavior is ours to control.
      - name: Start Azurite
        run: |
          npx --prefix api azurite \
            --silent --location /tmp/azurite --skipApiVersionCheck \
            --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 &
          for i in $(seq 1 30); do
            if nc -z 127.0.0.1 10002; then echo "azurite up"; exit 0; fi
            sleep 1
          done
          echo "::error::Azurite did not start within 30s"; exit 1

      - name: Integration tests (api/ against Azurite)
        run: npm test --prefix api

      - name: Typecheck shared/
        run: npm run typecheck

      - name: Typecheck web
        run: npm run typecheck --prefix web

      - name: Typecheck api
        run: npm run typecheck --prefix api

      - name: Build web
        run: npm run build --prefix web

      # The deploy hands SWA the already-built web/dist as app_location, and
      # SWA reads staticwebapp.config.json only from inside that artifact. If
      # it goes missing, platform.apiRuntime goes with it and the deploy fails
      # with the distinctly unhelpful "Function language info isn't provided".
      - name: Assert SWA config ships inside the app artifact
        run: |
          test -f web/dist/staticwebapp.config.json \
            || { echo "::error::web/dist/staticwebapp.config.json missing — it must live in web/public/"; exit 1; }
          node -e "
            const c = require('./web/dist/staticwebapp.config.json');
            if (!c.platform || !c.platform.apiRuntime) {
              console.error('::error::platform.apiRuntime missing from staticwebapp.config.json');
              process.exit(1);
            }
            console.log('apiRuntime =', c.platform.apiRuntime);
          "

      # The app CSP is `default-src 'self'` with no script-src, so any inline
      # <script> in the shipped index.html is blocked in production — and it
      # fails SILENTLY. The one we had was the pre-paint surface detection, so
      # the symptom would have been a wall tablet rendering the phone layout
      # with nothing in the console anyone was watching.
      - name: Assert no inline scripts in the app shell
        run: |
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('web/dist/index.html', 'utf8');
            const inline = [...html.matchAll(/<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/gi)]
              .filter((m) => m[1].trim().length > 0);
            if (inline.length) {
              console.error('::error::web/dist/index.html has ' + inline.length + ' inline <script> block(s); the CSP blocks them. Move to web/public/ and load with src.');
              process.exit(1);
            }
            console.log('no inline scripts in the app shell');
          "

      - name: Build api
        run: npm run build --prefix api

  # Exactly one end-to-end test, in its own job because it needs the whole stack
  # standing up — Azurite, the Functions host, and the SWA emulator — which is
  # several minutes the fast `verify` feedback loop should not have to wait for.
  #
  # It runs against :4280, never Vite on :5173. Only the SWA CLI applies
  # staticwebapp.config.json routing, proxies /api, and preserves the
  # same-origin cookie behaviour the session design depends on, so a test
  # against the dev server would pass while production was broken.
  e2e:
    runs-on: ubuntu-latest
    name: end-to-end smoke
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      # The root install is required, not incidental. `npm run seed` runs
      # through tsx, and tsx resolves a bare import the way Node does: by
      # walking up from the importing FILE. `shared/time.ts` imports luxon, and
      # shared/ sits beside api/ rather than inside it, so the walk goes
      # shared/node_modules → <root>/node_modules and never once looks in
      # api/node_modules. The deployed API is unaffected — esbuild bundles it
      # with nodePaths pointing at api/ — but the seed script is not bundled.
      - name: Install
        run: |
          npm ci
          npm ci --prefix web
          npm ci --prefix api
          npm ci --prefix e2e

      - name: Install Chromium
        run: npx --prefix e2e playwright install --with-deps chromium

      - name: Start Azurite
        run: |
          npx --prefix api azurite \
            --silent --location /tmp/azurite-e2e --skipApiVersionCheck &
          for i in $(seq 1 30); do
            if nc -z 127.0.0.1 10002; then echo "azurite up"; exit 0; fi
            sleep 1
          done
          echo "::error::Azurite did not start within 30s"; exit 1

      - name: Build
        run: |
          npm run build --prefix web
          npm run build --prefix api

      # `local` rather than the production household id: the seed script refuses
      # anything else, which is the guard that stops this job from ever pointing
      # at real family data.
      - name: Seed
        run: npm run seed --prefix api
        env:
          TABLES_CONNECTION_STRING: UseDevelopmentStorage=true
          HOUSEHOLD_ID: local
          HOUSEHOLD_TZ: America/Denver

      - name: Write local.settings.json
        run: |
          cat > api/local.settings.json <<'JSON'
          {
            "IsEncrypted": false,
            "Values": {
              "FUNCTIONS_WORKER_RUNTIME": "node",
              "AzureWebJobsStorage": "UseDevelopmentStorage=true",
              "TABLES_CONNECTION_STRING": "UseDevelopmentStorage=true",
              "HOUSEHOLD_ID": "local",
              "HOUSEHOLD_TZ": "America/Denver",
              "CRON_SHARED_SECRET": "ci-only-not-a-secret"
            }
          }
          JSON

      # `func` must be on PATH: the SWA CLI shells out to the Functions host
      # rather than importing it, so a core-tools binary that exists only in
      # e2e/node_modules/.bin is invisible to it.
      - name: Start the SWA emulator
        run: |
          export PATH="$PWD/e2e/node_modules/.bin:$PATH"
          npx --prefix e2e swa start web/dist \
            --api-location api --swa-config-location web/public \
            > /tmp/swa.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://localhost:4280/api/health >/dev/null; then
              echo "swa up"; exit 0
            fi
            sleep 2
          done
          echo "::error::SWA emulator did not become healthy within 180s"
          tail -50 /tmp/swa.log
          exit 1

      - name: Smoke test
        run: npm test --prefix e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-trace
          path: e2e/test-results/
          retention-days: 7

  # Mirrors the deploy job exactly: installs ONLY api/, with a bare repo root.
  #
  # The `verify` job above installs root dev-tooling dependencies, which can
  # silently satisfy a bare import inside shared/ and hide a resolution bug that
  # then breaks the deploy. That is precisely how the first Phase 0 deploy
  # failed. This job keeps the root bare so the failure surfaces here instead.
  api-bundle-isolation:
    runs-on: ubuntu-latest
    name: api bundle resolves without root deps
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install api only
        run: npm ci --prefix api

      - name: Assert the repo root is bare
        run: |
          if [ -d node_modules ]; then
            echo "::error::Repo root has node_modules; this job must run with a bare root to be meaningful."
            exit 1
          fi

      - name: Build api
        run: npm run build --prefix api
